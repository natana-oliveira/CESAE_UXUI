        <label>Nome:*</label> <br />
        <input type="text" name="nome" id="nome" class="inputText" /> <br />
        <label>Email:*</label> <br />
        <input
          type="email"
          name="email"
          placeholder="exemplo@exemplo.com"
          class="inputText"
          required
        />
        <br />
        <label>Telefone:</label> <br />

        <input type="date" /> <br />
        <label for="">Hora da reserva:</label> <br />
        <input type="time" /> <br />
        <label for="">Número de pessoas:</label> <br />
        <input type="number" /> <br />
        <label>Preferência de mesa:</label> <br />
        <select name="andar" class="caixas">

          <option value="1andar">1 andar</option>

        <br />
        <br />

          <option value="1andar">Festa empresa</option>
          <option value="1andar">Outras celebrações</option>
        </select>
        <br />

        <br />
        <label>Mensagem:*</label> <br />
        <textarea
          name="mensagem"
          rows="10"
          cols="30"
          class="inputText"
          required
        ></textarea>
