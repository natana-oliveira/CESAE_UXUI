<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Nothing+You+Could+Do&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styleGeneral.css" />
    <link rel="stylesheet" href="styleMain.css" />
    <script src="script.js" defer></script>
    <script src="scriptMain.js" defer></script>
    <title>Natana Oliveira — Portfolio</title>
  </head>
  <body>
    <!-- BACKGROUND -->
    <div class="backgroundPage">
      <!-- Fundo cósmico -->
      <div id="cosmic-bg" class="pos-fixed inset-0">
        <div class="cloud pos-absolute br-50 c1"></div>
        <div class="cloud pos-absolute br-50 c2"></div>
        <div class="cloud pos-absolute br-50 c3"></div>
      </div>
      <!-- Campo de estrelas -->
      <div id="stars-bg" class="pos-fixed inset-0 overflow-hidden"></div>
    </div>
    <!-- NAV BAR -->
    <nav id="navbar" class="pos-fixed d-flex align-items-center">
      <div class="logo d-flex align-items-center">
        <span class="orbit br-50"></span>natana.o
      </div>
      <ul class="nav-links d-flex" id="navLinks">
        <li>
          <a href="./pages/work.html" class="pos-relative overflow-hidden"
            >Work</a
          >
        </li>
        <li>
          <a href="./pages/about.html" class="pos-relative overflow-hidden"
            >About Me</a
          >
        </li>
        <li>
          <a
            href="./pages/contact.html"
            class="pos-relative overflow-hidden"
            id=""
            >Contacts</a
          >
        </li>
      </ul>
      <div class="d-flex align-items-center nav-right">
        <button
          id="nav-toggle"
          class="d-flex align-items-center justify-content-center"
          aria-label="Abrir menu"
          aria-expanded="false"
        >
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
        <button
          id="theme-toggle"
          class="d-flex pos-relative overflow-hidden align-items-center justify-content-center br-50"
        >
          <svg
            id="icon-moon"
            class="theme-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" />
          </svg>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            id="icon-sun"
            class="theme-icon"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
            />
          </svg>
        </button>
      </div>
    </nav>
    <main class="pos-relative">
      <section
        id="hero"
        class="hero d-flex pos-relative align-items-center overflow-hidden flex-column text-center"
      >
        <div class="hero-content pos-relative">
          <div class="role">Product & UX/UI Designer</div>
          <h1><em>creative universe</em></h1>
        </div>
        <!-- Mãos -->
        <div class="hands-container d-flex pos-absolute" id="handsContainer">
          <div class="hand left">
            <img src="./images/hero_leftHand.png" alt="" />
          </div>
          <div class="hand right">
            <img src="./images/hero_rightHand.png" alt="" />
          </div>
        </div>
        <div
          class="scroll-hint d-flex pos-absolute flex-column align-items-center"
        >
          <span class="falling-star"></span>
          <p>Explorar</p>
        </div>
        <div class="scroll-cue pos-absolute"></div>
      </section>

      <!-- MAIN SHOWCASE (Figma: Homepage > Desktop - 1 > Main) -->
      <section class="main-showcase" aria-label="Universo de projetos">
        <div class="collage">
          <!-- Grupo: Cesae Hub -->
          <div class="cesae-hub">
            <div class="cesae-hub__frame">
              <a
                class="cesae-hub__frame-inner"
                href="https://www.figma.com/proto/mgKX76jMK7cxZohMOxwKzy/Untitled?node-id=1-2764&p=f&viewport=-88%2C-616%2C0.09&t=TGjTHqQn2fTSTY17-1&scaling=scale-down&content-scaling=fixed&starting-point-node-id=1%3A6774&page-id=0%3A1"
                target="_blank"
                ><img src="./images/frameCesaeBlack.svg" alt="Cesae Hub"
              /></a>
            </div>
            <div class="cesae-hub__astronaut">
              <div class="cesae-hub__astronaut-inner">
                <img src="./images/astronaut.png" alt="" />
              </div>
            </div>
          </div>

          <!-- Grupo: SurfSway -->
          <div class="surf-sway">
            <a href="https://surfsway.netlify.app/" target="_blank">
              <img
                class="surf-sway__surfista"
                src="./images/surfer.png"
                alt="Surfista"
              />
            </a>
            <img
              class="surf-sway__stars"
              src="./images/starsBlack.png"
              alt=""
            />
          </div>

          <!-- Grupo: DAB -->
          <div class="dab">
            <a
              href="https://www.figma.com/proto/DFqbTHt3FXeieIbnkll6Ia/DAB?node-id=1-2704&viewport=-902%2C-81%2C0.1&t=WoSRyn6AXGT7l7og-1&scaling=scale-down&content-scaling=fixed&starting-point-node-id=1%3A2034&page-id=0%3A1"
              target="_blank"
              ><img
                class="dab__jupiter"
                src="./images/jupiter.png"
                alt="Jupiter" />
              <img
                class="dab__gato"
                src="./images/cat.png"
                alt="Gato astronauta"
            /></a>
          </div>

          <!-- Coordenadas -->
          <div class="coordenadas">
            <div class="coordenadas__inner">
              <img src="./images/coordinateBlack.png" alt="Coordenadas" />
            </div>
          </div>

          <!-- Grupo: Vinho -->
          <div class="vinho">
            <a href="#" target="_blank">
              <div class="vinho__woman">
                <div class="vinho__woman-inner">
                  <img src="./images/woman.png" alt="Mulher a beber vinho" />
                </div>
              </div>
              <div class="vinho__earth">
                <div class="vinho__earth-inner">
                  <img src="./images/earth.png" alt="" />
                </div>
              </div>
              <div class="vinho__saturno">
                <div class="vinho__saturno-inner">
                  <img src="./images/saturno.png" alt="" />
                </div>
              </div>
            </a>
            <img class="vinho__star" src="./images/starBlack.png" alt="" />
          </div>

          <!-- Grupo: Galeria -->
          <div class="galeria-group">
            <!-- TODO: substituir "#" pelo link final do projeto" -->
            <a href="#" target="_blank">
              <img
                class="galeria-group__frame"
                src="./images/gallery.png"
                alt="Galeria"
              />
            </a>
            <div class="galeria-group__paper-star">
              <div class="galeria-group__paper-star-inner">
                <img src="./images/paperStar.png" alt="" />
              </div>
            </div>
          </div>

          <!-- Black hole -->
          <div class="black-hole" id="blackHole">
            <img
              src="./images/blackHole.png"
              alt="Black Hole"
              class="black-hole-img"
              onclick="toggleBlackHoleMessage()"
            />
            <div class="black-hole-message">
              <img
                class="black-hole-message__arrow"
                src="./images/arrowDoodle.png"
                alt=""
              />
              <p class="black-hole-message__text">
                This is a black hole. Don't get lost here!
              </p>
            </div>
          </div>

          <!-- Grupo: Foody -->
          <div class="foody">
            <a href="#" target="_blank">
              <div class="foody__disco">
                <div class="foody__disco-inner">
                  <img src="./images/disco.png" alt="Foody" />
                </div>
              </div>
              <img class="foody__fruta" src="./images/fruit.png" alt="" />
            </a>
          </div>

          <!-- ComplexJupiter  -->
          <div class="complex-jupiter">
            <img
              class="complex-jupiter__bg"
              src="./images/complexJupiterBG.png"
              alt=""
            />
            <img
              class="complex-jupiter__spark"
              src="./images/spark.png"
              alt=""
            />
            <img
              class="complex-jupiter__planet"
              src="./images/bluePlanet.png"
              alt="Jupiter — visualização interativa"
            />
          </div>

          <!-- Maternar -->
          <a
            class="maternar"
            href="https://maternaremequilibrio.pt/"
            target="_blank"
          >
            <img src="./images/Maternar2.png" alt="Maternar" />
          </a>

          <!-- Grupo: Planet porta -->
          <div class="planet-porta">
            <!-- Animação de ondas (CodePen: https://codepen.io/denilsonsa/pen/JoRNvjQ) -->
            <svg
              class="planet-porta__waves"
              viewBox="-100 -100 200 200"
              preserveAspectRatio="xMidYMid"
              aria-hidden="true"
            >
              <g fill="none" stroke="#A8A8A8" stroke-width="1">
                <circle style="--anim-step: 0"></circle>
                <circle style="--anim-step: -1"></circle>
                <circle style="--anim-step: -2"></circle>
                <circle style="--anim-step: -3"></circle>
                <circle style="--anim-step: -4"></circle>
                <circle style="--anim-step: -5"></circle>
                <circle style="--anim-step: -6"></circle>
              </g>
            </svg>
            <img
              class="planet-porta__planet"
              src="./images/Planeta colorido.png"
              alt=""
            />
            <div class="planet-porta__door">
              <img
                class="planet-porta__door-img planet-porta__door-img--closed"
                src="./images/PortaFechada.png"
                alt="Porta fechada"
              />
              <img
                class="planet-porta__door-img planet-porta__door-img--open"
                src="./images/PortaAberta.png"
                alt="Porta aberta"
              />
            </div>
          </div>

          <!-- Envelope -->
          <div class="envelope" id="envelope">
            <div class="envelope__inner" onclick="toggleCVMessage()">
              <img
                class="envelope__img envelope__img--closed"
                src="./images/Envelope fechado.png"
                alt="Envelope fechado"
              />
              <img
                class="envelope__img envelope__img--open"
                src="./images/Envelope aberto.png"
                alt="Envelope aberto"
              />
            </div>
            <div class="cv-message">
              <img
                class="cv-message__arrow"
                src="./images/arrowDoodle.png"
                alt=""
              />
              <!-- TODO: substituir "#" pelo ficheiro final do CV -->
              <a
                class="cv-message__link"
                href="#"
                target="_blank"
                onclick="event.stopPropagation()"
                >Download my CV</a
              >
            </div>
          </div>

          <!-- Grupo: Fly me to the moon -->
          <div class="fly-me">
            <img
              class="fly-me__text"
              src="./images/Fly me to.png"
              alt="Fly me to the moon"
            />
          </div>

          <!-- Contacto: ao clicar revela as redes sociais (não navega) -->
          <div class="contacto" id="contact">
            <img
              class="contacto__trigger"
              src="./images/megafone.png"
              alt="Contacto"
              onclick="toggleContactMenu()"
            />
            <!-- Comportamento de referência: nav.menu do projeto Duck Pond
                 (https://github.com/mpsest/duckpond) — reproduzido apenas
                 na experiência (deslizar + stagger), não no código. -->
            <nav class="contacto__socials" aria-label="Redes sociais">
              <a
                class="contacto__icon contacto__icon--linkedin"
                href="#"
                target="_blank"
                aria-label="LinkedIn"
                ><img src="./images/linkedin.svg" alt=""
              /></a>
              <a
                class="contacto__icon contacto__icon--github"
                href="#"
                target="_blank"
                aria-label="GitHub"
                ><img src="./images/github.svg" alt=""
              /></a>
              <a
                class="contacto__icon contacto__icon--behance"
                href="#"
                target="_blank"
                aria-label="Behance"
                ><img src="./images/behance.svg" alt=""
              /></a>
              <a
                class="contacto__icon contacto__icon--mail"
                href="mailto:natana.ao@gmail.com"
                aria-label="Email"
                ><img src="./images/mailIcon.svg" alt=""
              /></a>
            </nav>
          </div>

          <!-- Rocket -->
          <div class="rocket">
            <div class="rocket__inner">
              <img src="./images/rocket.png" alt="" />
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <p class="copyright">
        Created by Natana Oliveira © 2026 - Made with curiosity and a little bit
        of stardust.
      </p>
    </footer>
  </body>
</html>
