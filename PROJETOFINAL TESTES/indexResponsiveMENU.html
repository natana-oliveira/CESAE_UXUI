<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <title>Natana Oliveira — Portfolio</title>

    <style>
      :root {
        --bg-dark: #05060d;
        --pink: #ff6fae;
        --gold: #ffcf7a;
        --sky-top: #bfe3ff;
        --white: #ffffff;
        --ink: #eef0ff;
        --ink-dim: rgba(238, 240, 255, 0.62);
        --line: rgba(238, 240, 255, 0.14);
        --panel: rgba(255, 255, 255, 0.04);

        --ease: cubic-bezier(0.16, 0.84, 0.32, 1);

        --font-family-base: "Lato", sans-serif;
        --font-family-detail: "Space Grotesk", sans-serif;
        --fb-w-light: 300;
        --fb-w-regular: 400;
        --fb-w-bold: 700;
        --fb-w-black: 900;

        /* Tipografia (escala) */
        --fs-2xs: 0.68rem;
        --fs-xs: 0.9rem;
        --fs-sm: 1rem;
        --fs-h1: clamp(2.4rem, 6.4vw, 5.4rem);

        /* Espaçamentos */
        --space-2: 8px;
        --space-3: 10px;
        --space-4: 14px;
        --space-5: 18px;
        --space-6: 20px;
        --space-7: 26px;

        /* Tamanhos de componentes */
        --size-orbit: 14px;
        --size-toggle: 48px;
        --size-icon: 20px;

        /* Layout (sobrescrito em tablet/mobile, desktop mantém os mesmos valores) */
        --nav-padding-y: var(--space-7);
        --nav-padding-x: 5vw;

        /* Reserva de espaço para a navbar fixa + espaçamento entre
           hero-content e hands-container. Escalam com a viewport
           para não exigir overrides por breakpoint. */
        --hero-safe-top: clamp(4.5rem, 10vh, 7rem);
        --hero-block-gap: clamp(1.25rem, 4vh, 3rem);

        /* Transições (durações reutilizadas) */
        --t-fast: 0.35s;
        --t-med: 0.6s;
        --t-slow: 1.2s;

        /* Glow hover (usado no menu e no botão de tema) */
        --glow-color: rgba(250, 247, 243, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: var(--font-family-base);
        color: var(--ink);
        background: var(--bg-dark);
        overflow-x: hidden;
        transition: color 0.8s var(--ease);
      }

      body.light {
        --ink: #1a1f36;
        --ink-dim: rgba(26, 31, 54, 0.65);
        --line: rgba(26, 31, 54, 0.12);
        --panel: rgba(255, 255, 255, 0.55);
      }

      /* Utilitárias */
      .d-flex {
        display: flex;
      }
      .pos-fixed {
        position: fixed;
      }
      .pos-relative {
        position: relative;
      }
      .pos-absolute {
        position: absolute;
      }
      .inset-0 {
        inset: 0;
      }
      .overflow-hidden {
        overflow: hidden;
      }
      .align-items-center {
        align-items: center;
      }
      .justify-content-center {
        justify-content: center;
      }
      .flex-column {
        flex-direction: column;
      }
      .br-50 {
        border-radius: 50%;
      }
      .text-center {
        text-align: center;
      }

      /* ---------- Fundo cósmico ---------- */
      #cosmic-bg {
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(120% 80% at 50% -10%, #171a3d 0%, var(--bg-dark) 55%),
          var(--bg-dark);
        transition: background 1.2s var(--ease);
      }
      body.light #cosmic-bg {
        background: linear-gradient(
          180deg,
          var(--sky-top) 0%,
          #eaf6ff 35%,
          var(--white) 100%
        );
      }
      .cloud {
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.95),
          rgba(255, 255, 255, 0) 70%
        );
        filter: blur(6px);
        opacity: 0;
        transition: opacity 1.4s var(--ease);
      }
      body.light .cloud {
        opacity: 0.9;
      }
      .c1 {
        width: 520px;
        height: 180px;
        top: 12%;
        left: 8%;
      }
      .c2 {
        width: 420px;
        height: 150px;
        top: 28%;
        right: 6%;
      }
      .c3 {
        width: 600px;
        height: 200px;
        top: 55%;
        left: 20%;
      }
      #stars-bg {
        z-index: 1;
        pointer-events: none;
        transition: opacity 1.1s var(--ease);
      }
      body.light #stars-bg {
        opacity: 0;
      }
      .star {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: var(--white);
        opacity: 0.15;
        animation: twinkle 3.2s ease-in-out infinite;
      }
      .star.gold {
        background: var(--gold);
        width: 2.5px;
        height: 2.5px;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.12;
        }
        50% {
          opacity: 0.9;
        }
      }

      /* ---------- Navbar ---------- */
      nav#navbar {
        top: 0;
        left: 0;
        right: 0;
        z-index: 40;
        justify-content: space-between;
        padding: var(--nav-padding-y) var(--nav-padding-x);
        opacity: 0;
        transform: translateY(-14px);
        transition:
          opacity 8s var(--ease),
          transform 2.4s var(--ease),
          background 0.6s;
      }
      nav#navbar.in {
        opacity: 1;
        transform: translateY(0);
      }

      /*  FONTE EM TODOS */
      /* CRIAR O SYSTEM DAS FONTES TAMANHO */
      .logo {
        font-size: var(--fs-sm);
        font-weight: 600;
        letter-spacing: 0.04em;
        gap: var(--space-5);
        font-family: var(--font-family-detail);
      }

      .logo .orbit {
        width: var(--size-orbit);
        height: var(--size-orbit);
        background: radial-gradient(
          circle at 30% 30%,
          var(--gold),
          var(--pink)
        );
        box-shadow: 0 0 14px var(--pink);
        animation: pulse 4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          box-shadow: 0 0 28px var(--pink);
        }
        50% {
          opacity: 0.6;
          box-shadow: 0 0 0 16px rgba(192, 132, 252, 0);
        }
      }
      .nav-links {
        gap: var(--space-6);
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .nav-links a {
        text-decoration: none;
        font-size: var(--fs-sm);
        letter-spacing: 0.15em;
        color: var(--ink);
        padding: 9px 16px;
        display: inline-block;
        transition: color var(--t-fast);
      }

      /* Efeito de brilho compartilhado (nav-links e theme-toggle) */
      .nav-links a::before,
      #theme-toggle::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(
          120px 60px at var(--x, 50%) var(--y, 50%),
          var(--glow-color),
          transparent var(--glow-spread, 70%)
        );
        transition: opacity var(--t-fast);
      }
      .nav-links a::before {
        border-radius: 100px;
      }
      #theme-toggle::before {
        --glow-spread: 30%;
      }
      .nav-links a:hover::before,
      #theme-toggle:hover::before {
        opacity: 1;
      }

      /* ---------- Theme toggle ---------- */
      #theme-toggle {
        width: var(--size-toggle);
        height: var(--size-toggle);
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        transition: color var(--t-fast);
      }
      body.light #icon-moon,
      #icon-sun {
        display: none;
      }
      body.light #icon-sun {
        display: block;
      }
      #theme-toggle svg {
        width: var(--size-icon);
        height: var(--size-icon);
      }
      body.light #theme-toggle {
        background: rgba(164, 164, 164, 0.097);
        border-color: rgba(15, 19, 33, 0.119);
        box-shadow: 0 4px 12px rgba(37, 37, 37, 0.08);
        color: rgba(62, 62, 62, 0.623);
      }
      .nav-right {
        gap: var(--space-4);
      }

      /* ---------- Nav toggle (hamburger) — visível apenas em tablet/mobile ---------- */
      #nav-toggle {
        display: none;
        width: var(--size-toggle);
        height: var(--size-toggle);
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 50%;
        cursor: pointer;
        flex-direction: column;
        gap: 5px;
      }
      .nav-toggle-bar {
        width: 18px;
        height: 2px;
        background: var(--ink);
        border-radius: 2px;
        transition:
          transform var(--t-fast),
          opacity var(--t-fast);
      }
      #nav-toggle[aria-expanded="true"] .nav-toggle-bar:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }
      #nav-toggle[aria-expanded="true"] .nav-toggle-bar:nth-child(2) {
        opacity: 0;
      }
      #nav-toggle[aria-expanded="true"] .nav-toggle-bar:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }
      main {
        z-index: 2;
      }
      /* ---------- Hero ---------- */
      /* hero-content e hands-container fluem normalmente dentro do
         flex column (herdado de .d-flex.flex-column.align-items-center),
         centralizados como um único bloco por justify-content + gap.
         padding-top reserva o espaço da navbar fixa para nunca sobrepor. */
      #hero {
        min-height: 100vh;
        justify-content: center;
        /* padding-top: var(--hero-safe-top); */
      }
      .hands-container {
        position: relative;
        z-index: 1;
        width: 100%;
        align-items: flex-end;
        pointer-events: none;
      }
      .hand {
        width: 50%;
        opacity: 0;
        will-change: transform, opacity;
        transition:
          transform 4s cubic-bezier(0.25, 1, 0.5, 1),
          opacity 3.5s ease;
      }
      .hand img {
        width: 100%;
        height: auto;
        display: block;
        mix-blend-mode: multiply;
      }
      .hand.left {
        transform: translate3d(-100%, 0, 0);
      }
      .hand.right {
        transform: translate3d(100%, 0, 0);
      }
      .hands-container.in .hand.left,
      .hands-container.in .hand.right {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
      .hands-container.exit .hand {
        opacity: 0;
      }
      .hands-container.exit .hand.left {
        transform: translate3d(-100%, -20%, 0);
      }
      .hands-container.exit .hand.right {
        transform: translate3d(100%, -20%, 0);
      }

      .hero-content {
        z-index: 3;
        transition:
          opacity 4.8s var(--ease) 0.8s,
          transform 4.8s var(--ease) 0.8s;
        opacity: 0;
        transform: translateY(24px);
      }
      .hero-content.in {
        opacity: 1;
        transform: translateY(0);
      }
      .role {
        font-size: var(--fs-xs);
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: var(--space-5);
        font-family: var(--font-family-detail);
      }
      h1 {
        font-size: var(--fs-h1);
        line-height: 1.02;
        margin: 0 0 20px;
        font-family: var(--font-family-detail);
      }
      h1 em {
        font-style: normal;
        background: linear-gradient(90deg, var(--pink), var(--gold));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .scroll-hint {
        bottom: 38px;
        left: 50%;
        transform: translate3d(-50%, 0, 0);
        z-index: 3;
        gap: var(--space-3);
        font-size: var(--fs-2xs);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--ink-dim);
        font-family: var(--font-family-detail);
        transition: opacity 3.2s var(--ease) 4s;
        opacity: 0;
      }
      .scroll-hint.in {
        opacity: 1;
      }

      .falling-star {
        width: 2px;
        height: 26px;
        border-radius: 2px;
        background: linear-gradient(180deg, var(--gold), transparent);
        animation: fall 1.8s infinite var(--ease);
      }
      @keyframes fall {
        0% {
          transform: translateY(-6px);
          opacity: 0;
        }
        30% {
          opacity: 1;
        }
        100% {
          transform: translateY(14px);
          opacity: 0;
        }
      }
      .scroll-cue {
        bottom: 3vh;
        left: 50%;
        transform: translate3d(-50%, 0, 0);
        width: 1px;
        height: 46px;
        background: linear-gradient(#c9a14a, transparent);
        opacity: 0.5;
        z-index: 3;
      }

      /* =========================================================
         RESPONSIVO — TABLET (≤1024px)
         Ajusta apenas espaçamentos/tamanhos via variáveis;
         o layout desktop permanece intocado acima deste breakpoint.
      ========================================================= */
      @media (max-width: 1024px) {
        :root {
          --nav-padding-y: var(--space-4);
        }
        .c1,
        .c2,
        .c3 {
          filter: blur(4px);
        }
        .hand {
          width: 55%;
        }
      }

      /* =========================================================
         RESPONSIVO — MOBILE/TABLET ESTREITO (≤768px)
         Ativa o menu hamburger e reorganiza a navbar.
      ========================================================= */
      @media (max-width: 768px) {
        :root {
          --nav-padding-x: 6vw;
          --size-toggle: 44px;
        }

        #nav-toggle {
          display: flex;
        }

        .nav-links {
          position: fixed;
          top: 0;
          right: 0;
          height: 100vh;
          width: min(72vw, 300px);
          flex-direction: column;
          justify-content: center;
          align-items: flex-start;
          gap: var(--space-6);
          padding: var(--space-7) 10vw;
          margin: 0;
          background: var(--bg-dark);
          border-left: 1px solid var(--line);
          transform: translateX(100%);
          transition: transform var(--t-med) var(--ease);
          z-index: 39;
        }
        body.light .nav-links {
          background: var(--white);
        }
        .nav-links.open {
          transform: translateX(0);
        }
        .nav-links a {
          font-size: 1.1rem;
        }

        .hand {
          width: 65%;
        }
        .hands-container {
          bottom: -4vh;
        }
      }

      /* =========================================================
         RESPONSIVO — MOBILE PEQUENO (≤480px)
      ========================================================= */
      @media (max-width: 480px) {
        :root {
          --space-7: 18px;
        }
        .role {
          letter-spacing: 0.25em;
        }
        .scroll-hint {
          bottom: 22px;
        }
        .hand {
          width: 78%;
        }
      }
    </style>
  </head>
  <body>
    <!-- BACKGROUND -->
    <div class="backgroundPage">
      <!-- Fundo cósmico -->
      <div id="cosmic-bg" class="pos-fixed inset-0">
        <div class="cloud pos-absolute br-50 c1"></div>
        <div class="cloud pos-absolute br-50 c2"></div>
        <div class="cloud pos-absolute br-50 c3"></div>
      </div>
      <!-- Campo de estrelas -->
      <div id="stars-bg" class="pos-fixed inset-0 overflow-hidden"></div>
    </div>
    <!-- NAV BAR -->
    <nav id="navbar" class="pos-fixed d-flex align-items-center">
      <div class="logo d-flex align-items-center">
        <span class="orbit br-50"></span>natana.o
      </div>
      <ul class="nav-links d-flex" id="navLinks">
        <li>
          <a href="./pages/work.html" class="pos-relative overflow-hidden"
            >Work</a
          >
        </li>
        <li>
          <a href="./pages/about.html" class="pos-relative overflow-hidden"
            >About Me</a
          >
        </li>
        <li>
          <a
            href="./pages/contact.html"
            class="pos-relative overflow-hidden"
            id=""
            >Contacts</a
          >
        </li>
      </ul>
      <div class="d-flex align-items-center nav-right">
        <button
          id="nav-toggle"
          class="d-flex align-items-center justify-content-center"
          aria-label="Abrir menu"
          aria-expanded="false"
        >
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
        <button
          id="theme-toggle"
          class="d-flex pos-relative overflow-hidden align-items-center justify-content-center br-50"
        >
          <svg
            id="icon-moon"
            class="theme-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" />
          </svg>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            id="icon-sun"
            class="theme-icon"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
            />
          </svg>
        </button>
      </div>
    </nav>
    <main class="pos-relative">
      <section
        id="hero"
        class="hero d-flex pos-relative align-items-center overflow-hidden flex-column text-center"
      >
        <div class="hero-content pos-relative">
          <div class="role">Product & UX/UI Designer</div>
          <h1><em>creative universe</em></h1>
        </div>
        <!-- Mãos -->
        <div class="hands-container d-flex pos-absolute" id="handsContainer">
          <div class="hand left">
            <img src="./images/hero_leftHand2.png" alt="" />
          </div>
          <div class="hand right">
            <img src="./images/hero_rightHand2.png" alt="" />
          </div>
        </div>

        <div
          class="scroll-hint d-flex pos-absolute flex-column align-items-center"
        >
          <span class="falling-star"></span>
          <p>Explorar</p>
        </div>
        <div class="scroll-cue pos-absolute"></div>
      </section>
    </main>
    <script>
      let body = document.querySelector("body");
      let themeBtn = document.getElementById("theme-toggle");

      /* ---------- Modo Noturno ---------- */
      themeBtn.addEventListener("click", () => {
        document.body.classList.toggle("light");
      });

      /* ---------- Menu mobile (hamburger) ---------- */
      const navToggle = document.getElementById("nav-toggle");
      const navLinks = document.getElementById("navLinks");

      function closeMobileMenu() {
        navLinks.classList.remove("open");
        navToggle.setAttribute("aria-expanded", "false");
      }

      navToggle.addEventListener("click", () => {
        const isOpen = navLinks.classList.toggle("open");
        navToggle.setAttribute("aria-expanded", String(isOpen));
      });

      navLinks.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", closeMobileMenu);
      });

      window.addEventListener("resize", () => {
        if (window.innerWidth > 768) closeMobileMenu();
      });

      /* ---------- Criar as estrelas dinamicas ---------- */
      function spawnStars(container, count, goldRatio) {
        const frag = document.createDocumentFragment();
        for (let i = 0; i < count; i++) {
          const s = document.createElement("div");
          s.className = "star" + (Math.random() < goldRatio ? " gold" : "");
          s.style.left = Math.random() * 100 + "%";
          s.style.top = Math.random() * 100 + "%";
          s.style.animationDelay = Math.random() * 3 + "s";
          frag.appendChild(s);
        }
        container.appendChild(frag);
      }

      spawnStars(document.getElementById("stars-bg"), 400, 0.2); // Cria: 400 estrelas -  20% douradas -  posições aleatórias

      (function () {
        // Entrada da mão após 2s
        const stage = document.getElementById("handsContainer");
        setTimeout(() => stage.classList.add("in"), 2000);

        // Exit on scroll
        let exited = false;
        window.addEventListener(
          "scroll",
          () => {
            if (window.scrollY > 100 && !exited) {
              stage.classList.add("exit");
              exited = true;
            } else if (window.scrollY <= 120 && exited) {
              stage.classList.remove("exit");
              exited = false;
            }
          },
          { passive: true },
        );
      })();

      /* ================= Entrance sequence ================= */
      window.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
          document.getElementById("navbar").classList.add("in");
          document.querySelector(".hero-content").classList.add("in");
          document.querySelector(".scroll-hint").classList.add("in");
        }, 200);
      });
    </script>
  </body>
</html>
