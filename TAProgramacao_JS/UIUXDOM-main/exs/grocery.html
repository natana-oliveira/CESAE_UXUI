<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vou às Compras</title>
    <script src="../js/exs.js" defer></script>
  </head>
  <body>
    <form id="myShoppingList" action="/backend">
      <input
        id="product"
        type="text"
        placeholder="Introduza o Produto"
        value=""
        name="product"
      /><br />
      <input
        name="qt"
        id="qt"
        type="number"
        placeholder="Introduza a Quantidade"
        value=""
      /><br />
      <button type="submit">Submeter</button>
    </form>

    <ul id="groceryList"></ul>

    <!-- -------- -->

    <table id="groceryTable" style="border: black 1px">
      <tr>
        <th>Produto</th>
        <th>Quantidade</th>
      </tr>
    </table>
  </body>
</html>
