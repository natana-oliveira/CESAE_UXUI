    <!-- FALTA FONTE -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Space+Grotesk:wght@300..700&display=swap"

    />

    <link rel="stylesheet" href="./css/style.css" />
    <script src="./JS/script.js" defer></script>
    <title>Natana Oliveira — Portfolio</title>
  </head>
  <body>
    <!-- BACKGROUND -->
    <div class="backgroundPage">
      <!-- Fundo cósmico -->
      <div id="cosmic-bg">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
      </div>
      <!-- Campo de estrelas -->
      <div id="stars-bg"></div>
      <div class="grain"></div>
    </div>
    <!-- NAV BAR -->
    <nav id="navbar">
      <div class="logo"><span class="orbit"></span>natana.o</div>
      <button id="theme-toggle">
        <svg
          id="icon-moon"
          class="theme-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        >
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" />
        </svg>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          id="icon-sun"
          class="theme-icon"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
          />
        </svg>
      </button>
    </nav>
    <main>
      <section id="hero">
        <div class="hero-content">
          <div class="role">Product & UX/UI Designer</div>
          <h1><em>creative universe</em></h1>
        </div>
        <div class="scroll-hint">
          <span class="falling-star"></span>
          <p>Explorar</p>
        </div>
      </section>
    </main>
  </body>
